---
- name: Checks if wezterm repo source list exists
  become: true
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/wezterm.list"
  register: wezterm_repo_source_list_check_result

- name: Makes a backup of wezterm repo source list file
  become: true
  # For Windows targets, use the ansible.windows.win_copy module instead.
  # Only run if the file exists
  when: wezterm_repo_source_list_check_result.stat.exists
  ansible.builtin.copy:
    src: "/etc/apt/sources.list.d/wezterm.list"
    dest: "/etc/apt/sources.list.d/bkp/wezterm.list"
    mode: "u=rw,go=r"

- name: Deletes wezterm repo source list file
  become: true
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file exists
  when: wezterm_repo_source_list_check_result.stat.exists
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/wezterm.list"
    state: absent

- name: Checks if wezterm repo source list save exists
  become: true
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/wezterm.list.save"
  register: wezterm_repo_source_list_save_check_result

- name: Deletes wezterm repo source list save file
  become: true
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file exists, no need to backup this one
  when: wezterm_repo_source_list_save_check_result.stat.exists
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/wezterm.list.save"
    state: absent

- name: Add Wezterm Repository
  become: true
  ansible.builtin.deb822_repository:
    name: wezterm
    types: [deb]
    signed_by: "https://apt.fury.io/wez/gpg.key"
    uris: "https://apt.fury.io/wez"
    suites: ["*"]
    components: ["*"]
    state: present
    enabled: true

- name: Install wezterm
  become: true
  ansible.builtin.package:
    name: wezterm
    update_cache: true
    state: present

- name: Checks if wezterm.lua file exists
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/wezterm/wezterm.lua"
  register: wezterm_lua_file_check_result

- name: Makes a backup of wezterm.lua file
  # For Windows targets, use the ansible.windows.win_copy module instead.
  # Only run if the file exists and is not a symlink
  when: >-
    wezterm_lua_file_check_result.stat.exists
    and ((wezterm_lua_file_check_result.stat.islnk is defined and not wezterm_lua_file_check_result.stat.islnk)
    or (wezterm_lua_file_check_result.stat.islnk is not defined))
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.config/wezterm/wezterm.lua"
    dest: "{{ ansible_env.HOME }}/.config/wezterm/wezterm.lua-backup"
    mode: "u=rw,go=r"

- name: Create a symbolic link to home from the wezterm.lua file
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file doesn't exist or exists and is not a symlink
  when: >-
    not wezterm_lua_file_check_result.stat.exists
    or wezterm_lua_file_check_result.stat.exists and
    ((wezterm_lua_file_check_result.stat.islnk is defined and not wezterm_lua_file_check_result.stat.islnk)
    or (wezterm_lua_file_check_result.stat.islnk is not defined))
  ansible.builtin.file:
    src: "{{ playbook_dir }}/wezterm/.config/wezterm/wezterm.lua"
    dest: "{{ ansible_env.HOME }}/.config/wezterm/wezterm.lua"
    state: link
    force: true
