---
- name: Check k9s installed version
  ansible.builtin.shell: k9s version -s | head -1 | awk '{print $2}'
  ignore_errors: true
  changed_when: false
  register: k9s_check_result

- name: Get latest release of k9s public repo
  when: k9s_check_result.rc != 0
  community.general.github_release:
    user: derailed
    repo: k9s
    action: latest_release
  register: k9s_latest_release

- name: Get k9s deb package
  when: k9s_check_result.rc != 0
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_latest_release.tag }}/k9s_linux_amd64.deb"
    dest: /tmp/k9s_linux_amd64.deb
    mode: "u=rw,go=r"

- name: Install k9s .deb package
  when: k9s_check_result.rc != 0
  become: true
  ansible.builtin.apt:
    deb: "/tmp/k9s_linux_amd64.deb"
  notify:
    - Remove k9s .deb package

- name: Install or update k9s package
  become: true
  ansible.builtin.package:
    name: k9s
    state: latest
    update_cache: true

- name: Checks if config.yaml file exists
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/k9s/config.yaml"
  register: k9s_config_file_check_result

- name: Makes a backup of config.yaml file
  # For Windows targets, use the ansible.windows.win_copy module instead.
  # Only run if the file exists and is not a symlink
  when: >-
    k9s_config_file_check_result.stat.exists
    and ((k9s_config_file_check_result.stat.islnk is defined and not k9s_config_file_check_result.stat.islnk)
    or (k9s_config_file_check_result.stat.islnk is not defined))
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.config/k9s/config.yaml"
    dest: "{{ ansible_env.HOME }}/.config/k9s/config.yaml-backup"
    mode: "u=rw,go=r"

- name: Create a symbolic link to home from the config.yaml file
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file doesn't exist or exists and is not a symlink
  when: >-
    not k9s_config_file_check_result.stat.exists
    or k9s_config_file_check_result.stat.exists and
    ((k9s_config_file_check_result.stat.islnk is defined and not k9s_config_file_check_result.stat.islnk)
    or (k9s_config_file_check_result.stat.islnk is not defined))
  ansible.builtin.file:
    src: "{{ playbook_dir }}/k9s/.config/k9s/config.yaml"
    dest: "{{ ansible_env.HOME }}/.config/k9s/config.yaml"
    state: link
    force: true
