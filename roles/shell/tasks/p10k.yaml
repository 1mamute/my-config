---
- name: Clone or update p10k repo # noqa: latest
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    single_branch: true
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1

- name: Checks if .p10k.zsh file exists
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.p10k.zsh"
  register: p10k_zsh_file_check_result

- name: Makes a backup of .p10k.zsh file
  # For Windows targets, use the ansible.windows.win_copy module instead.
  # Only run if the file exists and is not a symlink
  when: >-
    p10k_zsh_file_check_result.stat.exists
    and ((p10k_zsh_file_check_result.stat.islnk is defined and not p10k_zsh_file_check_result.stat.islnk)
    or (p10k_zsh_file_check_result.stat.islnk is not defined))
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.p10k.zsh"
    dest: "{{ ansible_env.HOME }}/.p10k.zsh-backup"
    mode: "u=rw,go=r"

- name: Create a symbolic link to home from the .p10k.zsh file
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file doesn't exist or exists and is not a symlink
  when: >-
    not p10k_zsh_file_check_result.stat.exists
    or p10k_zsh_file_check_result.stat.exists and
    ((p10k_zsh_file_check_result.stat.islnk is defined and not p10k_zsh_file_check_result.stat.islnk)
    or (p10k_zsh_file_check_result.stat.islnk is not defined))
  ansible.builtin.file:
    src: "{{ playbook_dir }}/p10k/.p10k.zsh"
    dest: "{{ ansible_env.HOME }}/.p10k.zsh"
    state: link
    force: true

- name: Checks if .p10k.custom.zsh file exists
  # For Windows targets, use the ansible.windows.win_stat module instead.
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.p10k.custom.zsh"
  register: p10k_custom_zsh_file_check_result

- name: Makes a backup of .p10k.custom.zsh file
  # For Windows targets, use the ansible.windows.win_copy module instead.
  # Only run if the file exists and is not a symlink
  when: >-
    p10k_custom_zsh_file_check_result.stat.exists
    and ((p10k_custom_zsh_file_check_result.stat.islnk is defined and not p10k_custom_zsh_file_check_result.stat.islnk)
    or (p10k_custom_zsh_file_check_result.stat.islnk is not defined))
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.p10k.custom.zsh"
    dest: "{{ ansible_env.HOME }}/.p10k.custom.zsh-backup"
    mode: "u=rw,go=r"

- name: Create a symbolic link to home from the .p10k.custom.zsh file
  # For Windows targets, use the ansible.windows.win_file module instead.
  # Only run if the file doesn't exist or exists and is not a symlink
  when: >-
    not p10k_custom_zsh_file_check_result.stat.exists
    or p10k_custom_zsh_file_check_result.stat.exists and
    ((p10k_custom_zsh_file_check_result.stat.islnk is defined and not p10k_custom_zsh_file_check_result.stat.islnk)
    or (p10k_custom_zsh_file_check_result.stat.islnk is not defined))
  ansible.builtin.file:
    src: "{{ playbook_dir }}/p10k/.p10k.custom.zsh"
    dest: "{{ ansible_env.HOME }}/.p10k.custom.zsh"
    state: link
    force: true
